name: alexey-personal-site
services:
  web:
    image: caddy@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    user: "1001:1001"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set the registered domain after DNS is ready}
    ports:
      - "169.58.224.66:80:80"
      - "169.58.224.66:443:443"
      - "169.58.224.66:443:443/udp"
    volumes:
      - ./releases/${SITE_RELEASE:?Set the release directory name}:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--header=Host: 169.58.224.66", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
